{{ $url := .Permalink }}
{{ $title := .Title }}
{{ $shareText := printf "%s — %s" $title $url }}

<section class="post-share" data-iv-remove="true" data-iv-share>
  <div class="post-share-group">
    <p class="post-share-label">{{ i18n "share_prompt" }}</p>
    <div class="share-actions" aria-label="{{ i18n `share_aria` }}">
      <a
        class="share-chip"
        href="https://x.com/intent/tweet?text={{ $title | urlquery }}&url={{ $url | urlquery }}"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="{{ i18n `share_x` }}"
        title="{{ i18n `share_x` }}">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 4 L18 20" />
          <path d="M18 4 L6 20" />
        </svg>
      </a>
      <a
        class="share-chip"
        href="https://bsky.app/intent/compose?text={{ $shareText | urlquery }}"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="{{ i18n `share_bluesky` }}"
        title="{{ i18n `share_bluesky` }}">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 11.6 C10.6 9.4 7.5 6.5 5.3 5.2 C4.2 4.6 3 5.1 3.4 6.6 C3.9 8.4 5.5 11.2 7 12.6 C8.2 13.7 9.5 14 10.4 13.9 C9.3 14.4 8.2 15.3 7.5 16.4 C6.6 17.8 7.1 19.3 8.7 18.8 C10.7 18.2 11.8 16.1 12 14.8 C12.2 16.1 13.3 18.2 15.3 18.8 C16.9 19.3 17.4 17.8 16.5 16.4 C15.8 15.3 14.7 14.4 13.6 13.9 C14.5 14 15.8 13.7 17 12.6 C18.5 11.2 20.1 8.4 20.6 6.6 C21 5.1 19.8 4.6 18.7 5.2 C16.5 6.5 13.4 9.4 12 11.6 Z"
            fill="currentColor" />
        </svg>
      </a>
      <a
        class="share-chip"
        href="https://vk.com/share.php?url={{ $url | urlquery }}&title={{ $title | urlquery }}"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="{{ i18n `share_vk` }}"
        title="{{ i18n `share_vk` }}">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M5 7.5 C5.2 12.5 7.6 15.5 11.8 15.5 H12.1 V12.6 C13.7 12.8 14.8 13.9 15.3 15.5 H18 C17.4 13.3 16 12.1 15.1 11.6 C16 11 17.2 9.6 17.5 7.5 H15.1 C14.7 9.2 13.6 10.6 12.1 10.8 V7.5 H9.7 V13.3 C8.2 12.9 6.3 11.3 6.2 7.5 Z"
            fill="currentColor" />
        </svg>
      </a>
      <a
        class="share-chip"
        href="https://www.linkedin.com/sharing/share-offsite/?url={{ $url | urlquery }}"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="{{ i18n `share_linkedin` }}"
        title="{{ i18n `share_linkedin` }}">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4" y="4" width="16" height="16" rx="3" />
          <circle cx="8" cy="9" r="1.2" fill="currentColor" stroke="none" />
          <path d="M8 11.5 V16.5" />
          <path d="M12 16.5 V11.5" />
          <path d="M12 13.3 C12.7 12.1 13.6 11.5 14.8 11.5 C16.5 11.5 17 12.6 17 14.3 V16.5" />
        </svg>
      </a>
      <a
        class="share-chip"
        href="https://www.reddit.com/submit?url={{ $url | urlquery }}&title={{ $title | urlquery }}"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="{{ i18n `share_reddit` }}"
        title="{{ i18n `share_reddit` }}">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="13" r="4.2" />
          <circle cx="9.6" cy="12.8" r="0.85" fill="currentColor" stroke="none" />
          <circle cx="14.4" cy="12.8" r="0.85" fill="currentColor" stroke="none" />
          <path d="M10 15 C10.7 15.6 11.4 15.9 12 15.9 C12.6 15.9 13.3 15.6 14 15" />
          <path d="M8.6 10.4 L9.8 7.4 L13.3 8.1" />
          <circle cx="8" cy="11.2" r="1.2" />
          <circle cx="16" cy="11.2" r="1.2" />
          <circle cx="14.2" cy="6.9" r="1.05" />
        </svg>
      </a>
      <a
        class="share-chip"
        href="https://t.me/share/url?url={{ $url | urlquery }}&text={{ $title | urlquery }}"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="{{ i18n `share_telegram` }}"
        title="{{ i18n `share_telegram` }}">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 5 L4.8 10.9 C4.1 11.2 4.2 12.2 5 12.4 L8.9 13.4 L10.4 18.2 C10.6 18.9 11.5 19 11.8 18.4 L14.2 14.7 L18.2 17.6 C18.8 18 19.6 17.7 19.7 17 L21 6 C21.1 5.3 20.6 4.8 20 5 Z" />
        </svg>
      </a>
      <a
        class="share-chip"
        href="https://share.joinmastodon.org/#text={{ $shareText | urlquery }}"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="{{ i18n `share_mastodon` }}"
        title="{{ i18n `share_mastodon` }}">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 17 V10.2 C7 8 8.7 6.2 11 6.2 H13 C15.3 6.2 17 8 17 10.2 V17" />
          <path d="M9.2 17 V11.2" />
          <path d="M14.8 17 V11.2" />
          <path d="M7 13.7 C7 18.5 8.9 20 12 20 C15.1 20 17 18.5 17 13.7" />
        </svg>
      </a>
      <a
        class="share-chip"
        href="https://news.ycombinator.com/submitlink?u={{ $url | urlquery }}&t={{ $title | urlquery }}"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="{{ i18n `share_hn` }}"
        title="{{ i18n `share_hn` }}">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 5.5 L12 11.7 L16 5.5" />
          <path d="M12 11.7 V18.5" />
        </svg>
      </a>
      <a
        class="share-chip"
        href="mailto:?subject={{ $title | urlquery }}&body={{ $shareText | urlquery }}"
        aria-label="{{ i18n `share_email` }}"
        title="{{ i18n `share_email` }}">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4" y="6.5" width="16" height="11" rx="2" />
          <path d="M5.5 8 L12 13 L18.5 8" />
        </svg>
      </a>
    </div>
  </div>
  <a class="post-share-toplink" href="#post-top">{{ i18n "back_to_top" }}</a>
</section>
