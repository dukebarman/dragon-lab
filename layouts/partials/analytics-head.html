{{- if hugo.IsProduction -}}
  {{- $analytics := site.Params.analytics | default dict -}}
  {{- with $analytics.google -}}
    {{- $googleID := printf "%v" . -}}
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ $googleID | urlquery }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag("js", new Date());
      gtag("config", {{ $googleID | jsonify | safeJS }});
    </script>
  {{- end }}
  {{- with $analytics.yandex -}}
    {{- $yandexID := printf "%v" . -}}
    <script>
      (function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
      m[i].l=1*new Date();
      k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})
      (window, document, "script", "https://mc.yandex.ru/metrika/tag.js", "ym");
      ym({{ $yandexID | jsonify | safeJS }}, "init", {
        clickmap: true,
        trackLinks: true,
        accurateTrackBounce: true
      });
    </script>
  {{- end }}
{{- end -}}
