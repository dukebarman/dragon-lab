[about_intro_kicker]
other = "Введение"

[about_intro_title]
other = "Дон Орен изучает странные устройства и объясняет сложные вещи понятным языком."

[about_intro_p1]
other = "Дон Орен Эсторский — вымышленный дракон-исследователь, который держит теплую лампу, загруженный рабочий стол и привычку записывать каждый полезный признак до того, как он потеряется."

[about_intro_p2]
other = "Архив следует за приборами, протоколами, интерфейсами и небольшими проектными решениями, из-за которых технологии становятся понятными или загадочными."

[about_intro_p3]
other = "Каждая заметка написана так, чтобы к ней можно было вернуться: немного лабораторный журнал, немного карта и немного напоминание, что терпеливое наблюдение часто сильнее громкого инструмента."

[about_focus_text]
other = "В демонстрационном архиве Дон Орен чаще всего занимается такими направлениями:"

[about_archive_kicker]
other = "Архив"

[about_archive_title]
other = "Эта демо-тема устроена как рабочий блокнот, а не как лента случайных заметок."

[about_archive_p1]
other = "Здесь собраны длинные разборы, наблюдения и технические наброски вокруг вымышленных исследовательских проектов. Архив задуман так, чтобы к материалам можно было возвращаться и связывать их между собой."

[about_archive_p2]
other = "Если ближе маршрут через темы, используй теги и графы. Если нужен линейный вход, начни с последних заметок ниже."

